[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inbox-monitor"
dynamic = ["version"]
description = "Wait for the next mail from a sender and print it in the terminal, for you or your AI agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TaeinYoon" }]
keywords = ["imap", "email", "monitor", "otp", "2fa", "cli", "agent"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Email",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Taepoung/inbox-monitor"
Repository = "https://github.com/Taepoung/inbox-monitor"
Issues = "https://github.com/Taepoung/inbox-monitor/issues"

[project.scripts]
inbox-monitor = "inbox_monitor.cli:main"

[tool.setuptools.package-data]
inbox_monitor = ["HELP.md"]

[tool.setuptools.dynamic]
version = { attr = "inbox_monitor.__version__" }
